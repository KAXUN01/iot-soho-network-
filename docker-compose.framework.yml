services:
  framework:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-framework
    ports:
      - "5000:5000"   # Flask onboarding API
      - "6653:6653"   # Ryu OpenFlow controller
    environment:
      - PYTHONUTF8=1
    volumes:
      - ./framework/data:/app/framework/data
      - ./"iot project"/adaptive_zero_trust_iot_framework/logs:/app/framework/logs
      - ./framework/honeypot_logs:/app/framework/honeypot_logs
      - ./framework/certificates:/app/framework/certificates
      - /var/run/docker.sock:/var/run/docker.sock  # allow honey pots control
    restart: unless-stopped

  mininet:
    image: mininet/mininet:latest
    container_name: iot-mininet
    privileged: true
    network_mode: host
    depends_on:
      - framework
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "mn --topo single,3 --mac --controller=remote,ip=127.0.0.1,port=6653 --switch ovsk,protocols=OpenFlow13"
    # For interactive use, override command when running: 
    # docker compose -f docker-compose.framework.yml run --rm mininet bash

# Honeypots (optional) can be run as separate services; framework can also deploy them via Docker SDK
# Example cowrie and dionaea could be added here if preferred

